name: Request CodeRabbit review

on:
  pull_request:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  request-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Request a full review for the latest commit
        uses: actions/github-script@v7
        with:
          script: |
            const pullNumber = context.payload.pull_request.number;
            const { data: pull } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: pullNumber,
            });
            if (pull.state !== "open") {
              core.info(`PR #${pullNumber} is not open; skipping review request.`);
              return;
            }

            const body = [
              "@coderabbitai full review",
              "",
              `<!-- coderabbit-review sha=${pull.head.sha} retry=0 -->`,
            ].join("\n");
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: pullNumber,
              body,
            });
            core.info(`Requested a full review for ${pull.head.sha}.`);

  retry-rate-limited-review:
    if: >-
      github.event_name != 'pull_request' &&
      (github.event.comment.user.login == 'coderabbitai' ||
       github.event.comment.user.login == 'coderabbitai[bot]' ||
       github.event.review.user.login == 'coderabbitai' ||
       github.event.review.user.login == 'coderabbitai[bot]') &&
      contains(github.event.comment.body || github.event.review.body, 'included review limit is currently reached')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: coderabbit-review-retry-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Wait for the included review limit, then retry
        uses: actions/github-script@v7
        with:
          script: |
            const comment = context.payload.comment ?? context.payload.review;
            const pullNumber =
              context.payload.issue?.number ??
              context.payload.pull_request?.number;
            if (!pullNumber || !context.payload.issue?.pull_request &&
                !context.payload.pull_request) {
              core.info("The comment is not attached to a pull request.");
              return;
            }

            const duration = comment.body.match(
              /next included review will be available in\s+(?:(\d+)\s*hours?)?(?:\s*(?:and\s*)?(\d+)\s*minutes?)?(?:\s*(?:and\s*)?(\d+)\s*seconds?)?/i
            );
            if (!duration || !duration.slice(1).some((part) => part !== undefined)) {
              core.setFailed("Could not parse CodeRabbit's next review availability time.");
              return;
            }

            const waitMs =
              (Number(duration[1] || 0) * 60 * 60 +
               Number(duration[2] || 0) * 60 +
               Number(duration[3] || 0)) * 1000 +
              60_000;
            const maxWaitMs = (5 * 60 + 50) * 60_000;
            if (waitMs > maxWaitMs) {
              core.setFailed(
                "CodeRabbit's stated wait exceeds the safe workflow limit of 5 hours 50 minutes."
              );
              return;
            }

            const { data: pull } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: pullNumber,
            });
            if (pull.state !== "open") {
              core.info(`PR #${pullNumber} is not open; skipping retry.`);
              return;
            }

            const [issueComments, reviewComments] = await Promise.all([
              github.paginate(github.rest.issues.listComments, {
                ...context.repo,
                issue_number: pullNumber,
                per_page: 100,
              }),
              github.paginate(github.rest.pulls.listReviewComments, {
                ...context.repo,
                pull_number: pullNumber,
                per_page: 100,
              }),
            ]);
            const allComments = [...issueComments, ...reviewComments];
            const rateLimitCreatedAt =
              comment.created_at ?? comment.submitted_at;
            const marker = new RegExp(
              `<!-- coderabbit-review sha=${pull.head.sha} retry=(\\d+) -->`
            );
            const reviewRequests = allComments
              .map((item) => ({ item, match: item.body?.match(marker) }))
              .filter(({ match }) => match)
              .sort(
                (left, right) =>
                  Date.parse(left.item.created_at) -
                  Date.parse(right.item.created_at)
              );
            const latestRequest = reviewRequests.at(-1);
            if (
              !latestRequest ||
              Date.parse(rateLimitCreatedAt) <=
                Date.parse(latestRequest.item.created_at)
            ) {
              core.info("This rate-limit comment does not follow a review request for the current commit.");
              return;
            }

            const currentAttempt = Number(latestRequest.match[1]);
            const maxRetries = 3;
            if (currentAttempt >= maxRetries) {
              core.warning(
                `Reached the ${maxRetries}-retry limit for commit ${pull.head.sha}.`
              );
              return;
            }
            const nextAttempt = currentAttempt + 1;
            core.info(
              `Waiting ${Math.ceil(waitMs / 60_000)} minutes before retry ${nextAttempt}.`
            );
            await new Promise((resolve) => setTimeout(resolve, waitMs));

            const { data: refreshedPull } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: pullNumber,
            });
            if (
              refreshedPull.state !== "open" ||
              refreshedPull.head.sha !== pull.head.sha
            ) {
              core.info("The PR closed or its head changed while waiting; skipping stale retry.");
              return;
            }

            const [latestIssueComments, latestReviewComments] =
              await Promise.all([
                github.paginate(github.rest.issues.listComments, {
                  ...context.repo,
                  issue_number: pullNumber,
                  per_page: 100,
                }),
                github.paginate(github.rest.pulls.listReviewComments, {
                  ...context.repo,
                  pull_number: pullNumber,
                  per_page: 100,
                }),
              ]);
            const latestMarkers = [
              ...latestIssueComments,
              ...latestReviewComments,
            ]
              .map((item) => item.body?.match(marker))
              .filter(Boolean)
              .map((match) => Number(match[1]));
            if (Math.max(...latestMarkers, 0) !== currentAttempt) {
              core.info("A newer review request already exists; skipping duplicate retry.");
              return;
            }

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: pullNumber,
              body: [
                "@coderabbitai full review",
                "",
                `<!-- coderabbit-review sha=${pull.head.sha} retry=${nextAttempt} -->`,
              ].join("\n"),
            });
            core.info(`Posted CodeRabbit retry ${nextAttempt} for ${pull.head.sha}.`);
