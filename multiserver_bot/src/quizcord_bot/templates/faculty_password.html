<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark"><title>Faculty password · Quizcord</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#f2f3f5;background:#313338}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 35%,#3b3d78 0,#313338 62%)}
main{width:min(460px,calc(100% - 32px));padding:36px;border-radius:12px;background:#2b2d31;box-shadow:0 18px 50px #11131888}
.brand{font-weight:750;letter-spacing:.5px;text-transform:uppercase;color:#b5bac1}.brand span{color:#a6a9ff}.eyebrow{margin-top:32px;color:#a6a9ff;font-size:12px;letter-spacing:1.4px;font-weight:700;text-transform:uppercase}
h1{font-size:26px;margin:8px 0 10px}.description{color:#b5bac1;line-height:1.55;margin:0 0 22px}
label{display:block;font-size:13px;color:#dbdee1;margin:14px 0 7px}input{width:100%;padding:12px;background:#1e1f22;border:1px solid #4e5058;border-radius:5px;color:#f2f3f5;font:inherit}
button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:5px;background:#5865f2;color:white;font:inherit;font-weight:700;cursor:pointer}button:hover{background:#4752c4}
.server-select{width:100%;margin:18px 0 4px;padding:10px;background:#1e1f22;color:#f2f3f5;border:1px solid #4e5058;border-radius:5px;font:inherit}
.muted{color:#949ba4;font-size:12px;line-height:1.5}.message{min-height:20px;margin-top:12px;color:#ff9e9e;font-size:13px}.hidden{display:none!important}a{color:#c4c9ce;font-size:13px}
</style></head><body><main>
<div class="brand">Quizcord <span>Faculty</span></div><div class="eyebrow">Second step</div>
<h1 id="title">Faculty password</h1>
<p class="description" id="description">Enter the temporary faculty password provided by your administrator.</p>
<select id="guild-select" class="server-select hidden" aria-label="Select server"></select>
<form id="password-form"><div id="captcha-container"><p class="muted">Complete this security check to continue.</p><div id="turnstile-widget" data-sitekey="__TURNSTILE_SITE_KEY__"></div></div>
<label for="password">Faculty password</label><input id="password" type="password" autocomplete="current-password" disabled required>
<div id="new-password-fields" class="hidden"><label for="new-password">New password</label><input id="new-password" type="password" autocomplete="new-password" minlength="12" maxlength="128"><label for="confirm-password">Confirm new password</label><input id="confirm-password" type="password" autocomplete="new-password" minlength="12" maxlength="128"><p class="muted">Use 12–128 characters. No character-mix rules are required. This is an app password, not your Discord password.</p></div>
<button id="submit" type="submit" disabled>Continue</button><div class="message" id="message" role="alert"></div></form>
<a href="/auth/logout">Sign out</a>
<script>
const form=document.getElementById("password-form"),password=document.getElementById("password"),fields=document.getElementById("new-password-fields"),captchaContainer=document.getElementById("captcha-container"),captchaWidget=document.getElementById("turnstile-widget"),message=document.getElementById("message"),button=document.getElementById("submit");
let mustChange=false,turnstileWidgetId=null,captchaToken="",verifiedTemporaryPassword="";
async function send(path,data){const response=await fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data),cache:"no-store"});const body=await response.json().catch(()=>({detail:"Request failed."}));if(response.status===401&&body.detail==="Please sign in again."){location.replace("/faculty/login");throw new Error(body.detail);}if(!response.ok){const error=new Error(body.detail||"Could not verify your password.");error.body=body;throw error;}return body;}
function setVerificationEnabled(enabled){password.disabled=!enabled;button.disabled=!enabled;}
function resetCaptcha(){captchaToken="";setVerificationEnabled(false);if(turnstileWidgetId!==null&&window.turnstile)window.turnstile.reset(turnstileWidgetId);}
function showCaptcha(){captchaContainer.classList.remove("hidden");if(!captchaWidget.dataset.sitekey)throw new Error("Security check is not configured. Contact an administrator.");if(turnstileWidgetId!==null)return Promise.resolve();return new Promise((resolve,reject)=>{const render=()=>{turnstileWidgetId=window.turnstile.render(captchaWidget,{sitekey:captchaWidget.dataset.sitekey,action:"faculty_password",callback:token=>{if(mustChange)return;captchaToken=token;setVerificationEnabled(true);message.textContent="";},"expired-callback":()=>{if(mustChange)return;captchaToken="";setVerificationEnabled(false);},"error-callback":()=>{if(mustChange)return;captchaToken="";setVerificationEnabled(false);message.textContent="Security check failed to load. Please retry.";}});resolve();};if(window.turnstile){render();return;}const script=document.createElement("script");script.src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit";script.async=true;script.defer=true;script.onload=render;script.onerror=()=>reject(new Error("Security check failed to load. Please retry."));document.head.appendChild(script);});}
function reloadForGuild(guildId){const url=new URL(location.href);url.searchParams.set("guild_id",guildId);url.searchParams.delete("session");location.assign(url);}
function getSavedGuild(){try{return localStorage.getItem("quizcord-selected-guild");}catch{return null;}}
function setSavedGuild(guildId){try{localStorage.setItem("quizcord-selected-guild",guildId);}catch{}}
async function initializeGuildSelector(){const selector=document.getElementById("guild-select"),response=await fetch("/api/guilds",{cache:"no-store"});if(!response.ok)throw new Error("Could not load your Discord servers.");const guilds=(await response.json()).filter(guild=>guild.is_faculty);if(!guilds.length)return;guilds.forEach(guild=>{const option=document.createElement("option");option.value=guild.id;option.textContent=guild.name;selector.append(option);});selector.classList.toggle("hidden",guilds.length<2);const requested=new URLSearchParams(location.search).get("guild_id"),saved=getSavedGuild(),current=await fetch("/api/me",{cache:"no-store"}).then(result=>result.json());selector.value=guilds.some(guild=>guild.id===requested)?requested:guilds.some(guild=>guild.id===saved)?saved:guilds.some(guild=>guild.id===current.guild_id)?current.guild_id:guilds[0].id;const selected=await fetch("/api/guilds/select",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({guild_id:selector.value}),cache:"no-store"});if(!selected.ok)throw new Error("Could not select the Discord server.");setSavedGuild(selector.value);selector.addEventListener("change",async()=>{selector.disabled=true;try{const changed=await fetch("/api/guilds/select",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({guild_id:selector.value}),cache:"no-store"});if(!changed.ok)throw new Error("Could not select the Discord server.");setSavedGuild(selector.value);reloadForGuild(selector.value);}catch(error){message.textContent=error.message;selector.disabled=false;}});}
initializeGuildSelector().then(showCaptcha).catch(error=>{message.textContent=error.message;});
form.addEventListener("submit",async event=>{event.preventDefault();message.textContent="";button.disabled=true;
try{if(!mustChange){verifiedTemporaryPassword=password.value;if(!captchaToken)throw new Error("Complete the security check before continuing.");const result=await send("/api/faculty/password/verify",{password:verifiedTemporaryPassword,turnstile_token:captchaToken});captchaToken="";mustChange=result.must_change;if(mustChange){captchaContainer.classList.add("hidden");fields.classList.remove("hidden");password.value=verifiedTemporaryPassword;password.autocomplete="new-password";password.readOnly=true;password.disabled=false;document.getElementById("title").textContent="Set a new password";document.getElementById("description").textContent="Your temporary password was accepted. Choose a new password to finish signing in.";button.textContent="Update password";button.disabled=false;return;}location.replace("/faculty");return;}
const next=document.getElementById("new-password").value,confirm=document.getElementById("confirm-password").value;if(next.length<12)throw new Error("Use at least 12 characters.");if(next!==confirm)throw new Error("The new passwords do not match.");await send("/api/faculty/password/change",{current_password:verifiedTemporaryPassword,new_password:next});location.replace("/faculty");
}catch(error){message.textContent=error.message;if(!mustChange)resetCaptcha();else button.disabled=false;}});
</script></main></body></html>
