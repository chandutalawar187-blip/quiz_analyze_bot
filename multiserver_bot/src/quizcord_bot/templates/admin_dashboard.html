<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <script>
    try {
      const savedTheme = localStorage.getItem("quizcord-dashboard-theme");
      if (savedTheme === "dark" || savedTheme === "light") {
        document.documentElement.dataset.theme = savedTheme;
      }
    } catch (error) {
      console.warn("Could not restore the dashboard theme preference.", error);
    }
  </script>
  <title>Quizcord Analytics</title>
  
  <link rel="stylesheet" href="/static/admin-dashboard.css">
  <link rel="stylesheet" href="/static/dashboard-theme.css">
</head>
<body>
  <header class="top"><div class="brand">Quizcord <span>Analytics</span></div><div class="account"><a id="back-link" href="/" hidden>← Dashboard</a><a id="faculty-password-link" href="/admin/faculty-passwords" hidden>Faculty passwords</a><select id="guild-select" aria-label="Select server" hidden></select><span id="account-name"></span><button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="false"><span class="icon icon-moon theme-toggle-icon" aria-hidden="true"></span><span class="theme-toggle-label">Dark mode</span></button><a href="/auth/logout">Sign out</a></div></header>
  <main>
    <nav class="dashboard-tabs" id="dashboard-tabs" aria-label="Dashboard sections">
      <button type="button" data-view="sessions" aria-selected="true"><span class="icon icon-book-2" aria-hidden="true"></span>Quiz sessions</button>
      <button type="button" data-view="users" aria-selected="false"><span class="icon icon-users" aria-hidden="true"></span>All users</button>
    </nav>
    <section class="heading" id="session-heading"><div><div class="eyebrow">Live monitoring</div><h1>Quiz dashboard</h1></div><select id="session-select" aria-label="Select quiz session"></select></section>
    <div id="content"><div class="empty">Loading quiz sessions…</div></div>
  </main>
  <script src="/static/dashboard-theme.js" defer></script>
  <script src="/static/admin-dashboard.js" defer></script>
</body>
</html>
