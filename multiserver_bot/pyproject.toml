[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quizcord-analytics-bot"
version = "1.0.0"
description = "A private Discord bot for Quizcord student analytics."
requires-python = ">=3.10"
dependencies = [
    "discord.py>=2.3,<3.0",
    "fastapi>=0.115,<0.120",
    "httpx>=0.27,<1.0",
    "itsdangerous>=2.2,<3.0",
    "openpyxl>=3.1,<4.0",
    "python-dotenv>=1.0,<2.0",
    "sentry-sdk>=2.44,<3.0",
    "starlette>=0.40,<1.0",
    "uvicorn>=0.30,<1.0",
]

[project.scripts]
quizcord-analytics = "quizcord_bot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
